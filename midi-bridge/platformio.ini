; USB-MIDI bridge for an ATmega32U4 board (Arduino Micro/Leonardo-class),
; relaying raw MIDI bytes received over UART1 from the M5Stack's UART2
; (GPIO17) into real class-compliant USB-MIDI via the MIDIUSB library.
;
; Wiring: M5Stack GPIO17 (TX2) -> this board's RX1, and GND -> GND.
; This board is then plugged into the USB host (computer/DAW) separately.

[env:leonardo]
platform = atmelavr
board = leonardo
framework = arduino
lib_deps =
	arduino-libraries/MIDIUSB@^1.0.5
